<div class="container">
    <img
        [src]="movie.backdropPath"
        alt="backdrop"
        width="100%"
        [routerLink]="'/media/' + movie.id">
    <div class="title"><h3>{{ movie.title }} ({{ movie.getReleaseYear() }})</h3></div>
    <div class="rating">
        <p-rating [(ngModel)]="movie.ratingAverage"
                  [cancel]="false" [readonly]="true"
                  [stars]="Constants.MAX_RATING_STARS"
        />
    </div>
</div>
