<div class="section-title">Recommendations reçues</div>
<p-carousel
    [value]="recommendations"
    [numVisible]="2"
    [numScroll]="1"
    [circular]="false"
    [showNavigators]="false"
    [showIndicators]="false"
>
    <ng-template let-movie pTemplate="item">
        <div class="surface-border border-round m-1">
            <div class="">
                <div class="relative mx-auto">
                    <img
                        src="{{ movie.posterPath }}"
                        [alt]="movie.title"
                        class="w-full border-round"
                        [routerLink]="'/media/' + movie.id"/>
                </div>
            </div>
            <div class="rating"><p-rating [(ngModel)]="movie.ratingAverage"
                                          [cancel]="false" [readonly]="true"
                                          [stars]="Constants.MAX_RATING_STARS"
            /></div>
            <div class="font-l font-semibold">
                {{ movie.title }} ({{ movie.getReleaseYear() }})
            </div>
            <div class="flex justify-content-between align-items-center">
                <div class="text-medium">
                    {{ movie.getFirstGenre() }} - {{ movie.getRuntimeFormatted() }}
                </div>
                <span>
                    <p-button icon="pi pi-check-square" styleClass="action-button"/>
                </span>
                <span>
                    <p-button icon="pi pi-bookmark" styleClass="action-button"/>
                </span>
            </div>
        </div>
    </ng-template>
</p-carousel>
