<div class="section-title">Votre watchlist</div>
<p-carousel
    [value]="watchlist"
    [numVisible]="3"
    [numScroll]="1"
    [circular]="false"
    [showNavigators]="false"
    [showIndicators]="false"
>
    <ng-template let-movie pTemplate="item">
        <div class="surface-border border-round m-1">
            <div class="">
                <div class="relative mx-auto">
                    <img
                        src="{{ movie.posterPath }}"
                        [alt]="movie.title"
                        class="w-full border-round"
                        [routerLink]="'/media/' + movie.id"/>
                </div>
            </div>
            <div class="font-l font-semibold">
                {{ movie.title }} ({{ movie.getReleaseYear() }})
            </div>
            <div class="flex justify-content-between align-items-center">
                <div class="text-medium">
                    {{ movie.getFirstGenre() }} - {{ movie.getRuntimeFormatted() }}
                </div>
                <span>
                        <p-button icon="pi pi-bookmark-fill" styleClass="action-button"/>
                    </span>
            </div>
        </div>
    </ng-template>
</p-carousel>
