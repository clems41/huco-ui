<p-progressSpinner ariaLabel="loading" [hidden]="!loading" />
<div class="section-title" *ngIf="searchResultMovies?.length > 0 && !loading">Films</div>
<p-dataView #dv *ngIf="searchResultMovies?.length > 0 && !loading" [value]="searchResultMovies" layout="grid" [showJumpToPageDropdown]="false">
    <ng-template let-movie pTemplate="grid" let-movies>
        <div class="grid grid-nogutter">
            <div class="col-4" *ngFor="let movie of searchResultMovies">
                <div class="surface-border surface-card border-round flex flex-column p-1">
                    <div class="flex justify-content-center border-round">
                        <div class="relative mx-auto">
                            <img class="border-round w-full" [src]="movie.posterPath" [alt]="movie.title"
                                 style="max-width: 200px;"
                                 [routerLink]="'/media/' + movie.id"/>
                        </div>
                    </div>
                    <div class="pt-1">
                        <div class="flex flex-row justify-content-between align-items-start gap-2">
                            <div>
                                <div class="text-lg font- mt-1">
                                    {{ movie.title }}
                                </div>
                                <div class="text-sm font-medium mt-1">
                                    {{ movie.getReleaseYear() }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</p-dataView>
<div *ngIf="searchResultSeries?.length > 0 && !loading" class="section-title">Séries</div>
<p-dataView *ngIf="searchResultSeries?.length > 0 && !loading" #dv [value]="searchResultSeries" layout="grid" [showJumpToPageDropdown]="false">
    <ng-template let-movie pTemplate="grid" let-movies>
        <div class="grid grid-nogutter">
            <div class="col-4" *ngFor="let serie of searchResultSeries">
                <div class="surface-border surface-card border-round flex flex-column p-1">
                    <div class="flex justify-content-center border-round">
                        <div class="relative mx-auto">
                            <img class="border-round w-full" [src]="serie.posterPath" [alt]="serie.title"
                                 style="max-width: 200px;"
                                 [routerLink]="'/media/' + serie.id"/>
                        </div>
                    </div>
                    <div class="pt-1">
                        <div class="flex flex-row justify-content-between align-items-start gap-2">
                            <div>
                                <div class="text-lg font-medium mt-1">
                                    {{ serie.title }}
                                </div>
                                <div class="text-lg font-medium mt-1">
                                    {{ serie.getReleaseYear() }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</p-dataView>
