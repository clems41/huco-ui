<div class="section-title">Films</div>
<p-progressSpinner ariaLabel="loading" [hidden]="!loading"/>
<p-dataView #dv [value]="searchResultMovies" layout="grid" [showJumpToPageDropdown]="false">
    <ng-template let-movie pTemplate="grid" let-movies>
        <div class="grid grid-nogutter">
            <div class="col-4" *ngFor="let movie of searchResultMovies">
                <div class="surface-border surface-card border-round flex flex-column p-1">
                    <div class="flex justify-content-center border-round">
                        <div class="relative mx-auto">
                            <img class="border-round w-full" [src]="movie.posterPath" [alt]="movie.title"
                                 style="max-width: 200px;"/>
                        </div>
                    </div>
                    <div class="pt-1">
                        <div class="flex flex-row justify-content-between align-items-start gap-2">
                            <div>
                                <div class="text-lg font-medium mt-1">
                                    {{ movie.title }}
                                </div>
                                <div class="text-lg font-medium mt-1">
                                    {{ movie.getReleaseYear() }}
                                </div>
                                <span class="font-medium text-secondary text-sm">
                                    {{ movie.getFirstGenre() }} - {{ movie.getRuntimeFormatted() }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</p-dataView>
<div class="section-title">Séries</div>
