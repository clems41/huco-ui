<div class="section-title">Recherches récentes</div>
<p-table [value]="searchHistory" styleClass="search-table">
    <ng-template pTemplate="body" let-history>
        <tr>
            <td (click)="onHistoryClick(history)">
                <a> <span class="pi pi-clock"></span> {{ history }}</a>
            </td>
        </tr>
    </ng-template>
</p-table>
